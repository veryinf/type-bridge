name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            goos: windows
            goarch: amd64
            asset_name: TypeBridge-windows-amd64.exe
          - os: macos-13
            goos: darwin
            goarch: amd64
            asset_name: TypeBridge-macos-amd64
          - os: macos-14
            goos: darwin
            goarch: arm64
            asset_name: TypeBridge-macos-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install task
        run: npm install -g @go-task/cli

      - name: Install wails3
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest

      - name: Build
        shell: bash
        run: task build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          APP_VERSION: ${{ github.ref_name }}

      - name: Bundle macOS .app
        if: runner.os == 'macOS'
        shell: bash
        run: task darwin:bundle

      - name: Prepare release asset
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp build/bin/TypeBridge.exe "build/bin/${{ matrix.asset_name }}"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: build/bin/
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Prepare release files
        run: |
          mkdir -p release
          # Windows: upload .exe directly
          cp artifacts/*.exe release/ 2>/dev/null || true
          # macOS: zip .app bundles
          for app in artifacts/*.app; do
            [ -d "$app" ] || continue
            name=$(basename "$app" .app)
            (cd artifacts && zip -r "../release/${name}.zip" "$(basename "$app")")
          done

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            release/*
