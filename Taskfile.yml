version: '3'

includes:
  common: ./build/Taskfile.yml

vars:
  APP_NAME: "TypeBridge"
  BIN_DIR: "build/bin"
  BIN_NAME: '{{.BIN_NAME | default "TypeBridge"}}'
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'

tasks:
  build:
    summary: Builds the application
    cmds:
      - task: common:build:frontend
        vars:
          PRODUCTION: "true"
      - task: common:build:remote
      - task: common:build:go

  run:
    summary: Runs the application
    cmds:
      - task: common:run

  dev:
    summary: Runs the application in development mode
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  darwin:package:
    summary: Packages the application into a macOS .app bundle and .dmg
    cmds:
      - task: common:darwin:package

  darwin:bundle:
    summary: Creates .app bundle from existing build output
    cmds:
      - task: common:darwin:bundle
