# This file contains the configuration for this project.
version: '3'

# This information is used to generate the build assets.
info:
  companyName: "veryinf"
  productName: "Type Bridge"
  productIdentifier: "com.veryinf.typebridge"
  description: "手机电脑输入同步工具"
  copyright: "(c) 2025, veryinf"
  comments: "Type Bridge - 手机电脑输入同步"
  version: "1.0.0"

# Dev mode configuration
dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - frontend
      - remote
      - bin
      - db
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
      - "*_test.go"
    watched_extension:
      - "*.go"
    git_ignore: true
  executes:
    - cmd: wails3 task common:install:frontend:deps
      type: once
    - cmd: wails3 task common:generate:bindings
      type: once
    - cmd: wails3 task common:dev:remote
      type: background
    - cmd: wails3 task common:dev:frontend
      type: background
    - cmd: wails3 task common:build:go:dev
      type: blocking
    - cmd: wails3 task common:run:dev
      type: primary
