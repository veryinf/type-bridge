version: '3'

tasks:
  go:mod:tidy:
    summary: Runs `go mod tidy`
    internal: true
    cmds:
      - go mod tidy

  install:frontend:deps:
    summary: Install frontend dependencies
    dir: frontend
    sources:
      - package.json
      - pnpm-lock.yaml
    generates:
      - node_modules
    cmds:
      - pnpm install

  build:frontend:
    label: build:frontend (PRODUCTION={{.PRODUCTION}})
    summary: Build the frontend project
    dir: frontend
    sources:
      - "**/*"
      - exclude: node_modules/**/*
    generates:
      - dist/**/*
    deps:
      - task: install:frontend:deps
      - task: generate:bindings
        vars:
          BUILD_FLAGS:
            ref: .BUILD_FLAGS
    cmds:
      - pnpm run build
    env:
      PRODUCTION: '{{.PRODUCTION | default "false"}}'

  build:remote:
    summary: Build the remote frontend
    dir: remote
    sources:
      - "**/*"
      - exclude: node_modules/**/*
    generates:
      - dist/**/*
    cmds:
      - pnpm install
      - pnpm run build

  generate:bindings:
    label: generate:bindings (BUILD_FLAGS={{.BUILD_FLAGS}})
    summary: Generates bindings for the frontend
    deps:
      - task: go:mod:tidy
    sources:
      - "**/*.[jt]s"
      - exclude: frontend/**/*
      - "**/*.go"
      - go.mod
      - go.sum
    generates:
      - frontend/bindings/**/*
    cmds:
      - wails3 generate bindings -f '{{.BUILD_FLAGS}}' -clean=true -ts

  generate:icons:
    summary: Generates Windows .ico and Mac .icns files from an image
    dir: build
    sources:
      - "appicon.png"
    generates:
      - "darwin/icons.icns"
      - "icon.ico"
    cmds:
      - wails3 generate icons -input appicon.png -macfilename darwin/icons.icns -windowsfilename icon.ico

  generate:winres:
    summary: Regenerate Windows .syso files (only needed when icon or version changes)
    dir: build/windows
    cmds:
      - go-winres make --out ..\..\resource

  dev:frontend:
    summary: Runs the frontend in development mode
    dir: frontend
    deps:
      - task: install:frontend:deps
    cmds:
      - pnpm dev --port {{.VITE_PORT}} --strictPort

  dev:remote:
    summary: Runs the remote in development mode
    dir: remote
    cmds:
      - pnpm install
      - pnpm dev --port 3020 --strictPort

  build:go:
    summary: Builds the Go application
    deps:
      - task: go:mod:tidy
    cmds:
      - |
        if [ "$(go env GOOS)" = "darwin" ]; then
          go build -buildvcs=false -ldflags="-s -w -H darwin" -o {{.BIN_DIR}}/{{.BIN_NAME}}
        else
          go build -buildvcs=false -ldflags="-s -w -H windowsgui" -o {{.BIN_DIR}}/{{.BIN_NAME}}.exe
        fi
    env:
      CGO_ENABLED: 1
      MACOSX_DEPLOYMENT_TARGET: "13.0"

  build:go:dev:
    summary: Builds the Go application with dev binary name
    deps:
      - task: go:mod:tidy
    cmds:
      - |
        if [ "$(uname)" = "Darwin" ]; then
          go build -buildvcs=false -gcflags=all="-l" -ldflags="-H darwin" -o {{.BIN_DIR}}/{{.APP_NAME}}-dev
        else
          go build -buildvcs=false -gcflags=all="-l" -o {{.BIN_DIR}}/{{.APP_NAME}}-dev.exe
        fi
    env:
      CGO_ENABLED: 1
      MACOSX_DEPLOYMENT_TARGET: "13.0"

  run:
    summary: Runs the application
    cmds:
      - |
        if [ "$(uname)" = "Darwin" ]; then
          {{.BIN_DIR}}/{{.BIN_NAME}}
        else
          {{.BIN_DIR}}/{{.BIN_NAME}}.exe
        fi

  run:dev:
    summary: Runs the dev application
    cmds:
      - |
        if [ "$(uname)" = "Darwin" ]; then
          {{.BIN_DIR}}/{{.APP_NAME}}-dev
        else
          {{.BIN_DIR}}/{{.APP_NAME}}-dev.exe
        fi

  darwin:package:
    summary: Packages the application into a macOS .app bundle and .dmg
    deps:
      - task: build:frontend
      - task: build:remote
      - task: build:go
      - task: generate:icons
    cmds:
      - |
        APP_DIR="{{.BIN_DIR}}/{{.APP_NAME}}.app"
        CONTENTS="$APP_DIR/Contents"
        MACOS_DIR="$CONTENTS/MacOS"
        RESOURCES_DIR="$CONTENTS/Resources"

        # 清理旧的 .app
        rm -rf "$APP_DIR"

        # 创建 .app 目录结构
        mkdir -p "$MACOS_DIR"
        mkdir -p "$RESOURCES_DIR"

        # 复制二进制文件
        cp "{{.BIN_DIR}}/{{.BIN_NAME}}" "$MACOS_DIR/{{.APP_NAME}}"

        # 复制图标
        cp build/darwin/icons.icns "$RESOURCES_DIR/AppIcon.icns"

        # 复制 Info.plist
        cp build/darwin/Info.plist "$CONTENTS/Info.plist"

        # Ad-hoc 签名
        codesign --force --deep --sign - "$APP_DIR"

        echo "✅ .app bundle 已创建: $APP_DIR"

        # 检查 create-dmg 是否安装
        if command -v create-dmg &> /dev/null; then
          DMG_PATH="{{.BIN_DIR}}/{{.APP_NAME}}.dmg"
          rm -f "$DMG_PATH"

          create-dmg \
            --volname "{{.APP_NAME}}" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --app-drop-link 425 170 \
            "$DMG_PATH" \
            "$APP_DIR" 2>&1 || true

          if [ -f "$DMG_PATH" ]; then
            echo "✅ DMG 已创建: $DMG_PATH"
          else
            echo "⚠️  DMG 创建失败，请安装 create-dmg: brew install create-dmg"
            echo "   手动执行: create-dmg --volname '{{.APP_NAME}}' --window-pos 200 120 --window-size 600 400 --icon-size 100 --app-drop-link 425 170 '$DMG_PATH' '$APP_DIR'"
          fi
        else
          echo "⚠️  未找到 create-dmg，跳过 DMG 生成"
          echo "   安装: brew install create-dmg"
          echo "   手动执行: create-dmg --volname '{{.APP_NAME}}' --window-pos 200 120 --window-size 600 400 --icon-size 100 --app-drop-link 425 170 '{{.BIN_DIR}}/{{.APP_NAME}}.dmg' '$APP_DIR'"
        fi

  update:build-assets:
    summary: Updates the build assets
    dir: build
    cmds:
      - wails3 update build-assets -name "{{.APP_NAME}}" -binaryname "{{.APP_NAME}}" -config config.yml -dir .
